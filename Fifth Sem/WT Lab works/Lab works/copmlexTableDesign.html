<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales Performance Table</title>
    <style>
        table {
            border-collapse: collapse;
            width: 80%;
            margin: 20px auto;
            border: 3px solid #6a1b9a;
            font-family: Arial, sans-serif;
        }
        th, td {
            text-align: center;
            padding: 10px;
            border: 1px solid #9c27b0;
        }
        th {
            background-color: #6a1b9a;
            color: white;
        }
        tr:nth-child(even) {
            background-color: #f3e5f5;
        }
        tfoot {
            font-weight: bold;
            background-color: #4a148c;
            color: white;
        }
    </style>
</head>
<body>
    <table>
        <tr>
            <th rowspan="3">Region</th>
            <th rowspan="3">Product</th>
            <th colspan="4">Quarterly Performance</th>
            <th rowspan="3">Total</th>
        </tr>
        <tr>
            <th colspan="2">First Half</th>
            <th colspan="2">Second Half</th>
        </tr>
        <tr>
            <th>Q1</th>
            <th>Q2</th>
            <th>Q3</th>
            <th>Q4</th>
        </tr>
        <tr>
            <td rowspan="3">East</td>
            <td>Laptops</td>
            <td>50</td>
            <td>55</td>
            <td>60</td>
            <td>65</td>
            <td>230</td>
        </tr>
        <tr>
            <td>Phones</td>
            <td>100</td>
            <td>110</td>
            <td>105</td>
            <td>120</td>
            <td>435</td>
        </tr>
        <tr>
            <td colspan="5">Region Average</td>
            <td>332.5</td>
        </tr>
        <tr>
            <td rowspan="3">West</td>
            <td>Laptops</td>
            <td>40</td>
            <td>45</td>
            <td>50</td>
            <td>55</td>
            <td>190</td>
        </tr>
        <tr>
            <td>Phones</td>
            <td>90</td>
            <td>95</td>
            <td>100</td>
            <td>110</td>
            <td>395</td>
        </tr>
        <tr>
            <td colspan="5">Region Average</td>
            <td>292.5</td>
        </tr>
        <tr>
            <th colspan="6">Overall Company Average</th>
            <th>312.5</th>
        </tr>
    </table>
</body>
</html>
